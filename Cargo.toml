[package]
name = "zfr-core"
version = "0.2.1"
edition = "2021"
description = "ZFR Core — High-performance Rust transport engine and OpenAI-compatible gateway with wire protocol normalization, multi-homed dual-stack routing and Windows service support"
license = "MIT"
repository = "https://github.com/wayne091106-hash/zfr-core"
keywords = ["opencode", "zen", "llm", "router", "proxy"]
categories = ["command-line-utilities", "network-programming", "web-programming::http-server"]

[[bin]]
name = "zfr"
path = "src/main.rs"

[lib]
name = "zfr_core"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
